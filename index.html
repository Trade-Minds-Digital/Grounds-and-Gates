    <script>
      // GitHub Pages branch deploy fallback: if served from root /(root) where raw TypeScript cannot run
      (function() {
        var host = window.location.hostname;
        var path = window.location.pathname;
        if (host.indexOf('github.io') !== -1 && path.indexOf('/dist') === -1 && path.indexOf('/docs') === -1) {
          var target = path.replace(/\/$/, '') + '/dist/';
          window.location.replace(target);
        }
      })();
    </script>
